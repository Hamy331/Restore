      responses:
        '200':
          description: Success envelope with data; see modules/feeds/README.md for payloads
        '401':
          description: Authentication required
    post:
      tags: [Feed]
      summary: post /feeds/{id}/comments
      security: [{bearerAuth: []}]
      parameters:
        - in: path
