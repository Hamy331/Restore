openapi: 3.0.0
info:
  title: ReStore API - Auth
  version: 1.0.0
paths:
  /api/v1/auth/me:
    get:
      summary: Get current logged in user
      description: Returns the user profile for the currently authenticated user based on the JWT token.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: 'boolean', example: true }
                  message: { type: 'string', example: 'User information retrieved successfully' }
                  data: { $ref: '#/components/schemas/User' }
        401:
          description: Unauthorized - Token is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      summary: Login user
      description: Authenticates a user with email and password and returns a JWT token.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: 'boolean', example: true }
                  message: { type: 'string', example: 'Login successful' }
                  data: 
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: 'string', example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...' }
        400:
          description: Bad request - Missing email or password
        401:
          description: Unauthorized - Incorrect credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account with email, password, username, and full name.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: Account registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: 'boolean', example: true }
                  message: { type: 'string', example: 'Account registered successfully' }
                  data: { $ref: '#/components/schemas/User' }
        400:
          description: Bad request - Missing fields or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/verify-registration-otp:
    post:
      summary: Verify registration OTP
      description: Validates the 6-digit OTP sent to the user's email during registration. Upon success, activates the account and returns a JWT token.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        200:
          description: Registration OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: 'boolean', example: true }
                  message: { type: 'string', example: 'Email verified successfully.' }
                  data: 
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: 'string', example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...' }
        400:
          description: Bad request - Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset OTP
      description: Sends a 6-digit OTP to the user's email address if the account exists.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        200:
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: 'boolean', example: true }
                  message: { type: 'string', example: 'OTP đã được gửi đến email của bạn.' }
        400:
          description: Bad request - Email missing or account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/verify-otp:
    post:
      summary: Verify password reset OTP
      description: Validates the 6-digit OTP sent to the user's email.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        200:
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: 'boolean', example: true }
                  message: { type: 'string', example: 'Xác thực OTP thành công.' }
        400:
          description: Bad request - Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/reset-password:
    post:
      summary: Reset account password
      description: Sets a new password for the account using a valid OTP.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: 'boolean', example: true }
                  message: { type: 'string', example: 'Đổi mật khẩu thành công.' }
        400:
          description: Bad request - Invalid OTP or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
