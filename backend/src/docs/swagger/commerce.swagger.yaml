paths:
  /api/v1/stores/categories:
    get:
      tags: [Stores]
      summary: Danh mục có thể chọn khi đăng tin hoặc mua gói cửa hàng
      responses:
        200: { description: Danh sách danh mục }
  /api/v1/stores/packages:
    get:
      tags: [Stores]
      summary: Giá và hạn mức gói Basic/Pro
      responses:
        200: { description: Danh sách gói }
  /api/v1/stores/me:
    get:
      tags: [Stores]
      summary: Gói hiện tại, danh mục trọng tâm và mức sử dụng
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Quyền lợi hiện hành }
  /api/v1/stores/orders:
    post:
      tags: [Stores]
      summary: Tạo đơn mua gói 30 ngày, chờ admin xác nhận thanh toán
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId, categoryId]
              properties:
                packageId: { type: string }
                categoryId: { type: string }
      responses:
        201: { description: Đơn chờ xác nhận }
  /api/v1/stores/admin/orders:
    get:
      tags: [Stores]
      summary: Đơn gói cửa hàng đang chờ (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Danh sách đơn }
  /api/v1/stores/admin/orders/{id}/confirm:
    post:
      tags: [Stores]
      summary: Xác nhận đã nhận tiền và kích hoạt gói (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Đã kích hoạt hoặc gia hạn }
  /api/v1/stores/admin/orders/{id}/reject:
    post:
      tags: [Stores]
      summary: Từ chối đơn gói cửa hàng (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Đã từ chối }
  /api/v1/admin/store-packages:
    get:
      tags: [Stores]
      summary: Danh sách gói cửa hàng trong trang quản trị
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Gói cửa hàng đang hoạt động và đã ngừng bán }
        403: { description: Không có quyền quản lý gói cửa hàng }
  /api/v1/admin/store-packages/{id}:
    put:
      tags: [Stores]
      summary: Cập nhật hạn mức và quyền lợi gói cửa hàng
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, monthlyPrice, dailyListingLimit, activeListingLimit, monthlyPromotionQuota, priorityLevel]
              properties:
                name: { type: string, minLength: 3, maxLength: 80 }
                monthlyPrice: { type: string, pattern: '^[0-9]{1,12}$' }
                dailyListingLimit: { type: integer, minimum: 1, maximum: 10000 }
                activeListingLimit: { type: integer, minimum: 1, maximum: 100000 }
                draftLimit: { type: integer, minimum: 1, maximum: 1000 }
                monthlyPromotionQuota: { type: integer, minimum: 0, maximum: 10000 }
                priorityLevel: { type: integer, minimum: 0, maximum: 10 }
      responses:
        200: { description: Gói cửa hàng đã cập nhật }
        403: { description: Không có quyền quản lý gói cửa hàng }
  /api/v1/admin/store-orders:
    get:
      tags: [Stores]
      summary: Tìm và lọc đơn mua gói cửa hàng
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, CONFIRMED, REJECTED] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        200: { description: Danh sách đơn và thông tin người mua }
        403: { description: Không có quyền quản lý đơn gói cửa hàng }
  /api/v1/promotions/packages:
    get:
      tags: [Promotions]
      summary: Gói Đẩy Tin và Tin Ưu Tiên
      responses:
        200: { description: Danh sách gói quảng cáo }
    post:
      tags: [Promotions]
      summary: Tạo gói quảng cáo (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, durationDays, priority, price, active]
              properties:
                name: { type: string, minLength: 3, maxLength: 80 }
                kind: { type: string, enum: [BUMP, FEATURED] }
                durationDays: { type: integer, minimum: 1, maximum: 30 }
                priority: { type: integer, minimum: 0, maximum: 10 }
                price: { type: string, pattern: '^(0|[1-9][0-9]{0,11})$' }
                active: { type: boolean }
      responses:
        201: { description: Gói mới }
  /api/v1/promotions/packages/{id}:
    put:
      tags: [Promotions]
      summary: Sửa gói quảng cáo (ADMIN)
      description: Sau khi có giao dịch chỉ được sửa tên, giá và trạng thái bán.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, durationDays, priority, price, active]
              properties:
                name: { type: string, minLength: 3, maxLength: 80 }
                kind: { type: string, enum: [BUMP, FEATURED] }
                durationDays: { type: integer, minimum: 1, maximum: 30 }
                priority: { type: integer, minimum: 0, maximum: 10 }
                price: { type: string, pattern: '^(0|[1-9][0-9]{0,11})$' }
                active: { type: boolean }
      responses:
        200: { description: Gói đã sửa }
  /api/v1/promotions/redeem:
    post:
      tags: [Promotions]
      summary: Dùng lượt quảng cáo kèm gói trong danh mục trọng tâm
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, packageId]
              properties:
                listingId: { type: string }
                packageId: { type: string }
      responses:
        201: { description: Quảng cáo được kích hoạt }
  /api/v1/promotions/orders:
    post:
      tags: [Promotions]
      summary: Tạo đơn quảng cáo riêng, chờ admin xác nhận
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, packageId]
              properties:
                listingId: { type: string }
                packageId: { type: string }
      responses:
        201: { description: Đơn chờ xác nhận }
  /api/v1/promotions/admin/orders:
    get:
      tags: [Promotions]
      summary: Đơn quảng cáo đang chờ (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Danh sách đơn }
  /api/v1/promotions/admin/orders/{id}/confirm:
    post:
      tags: [Promotions]
      summary: Xác nhận đã nhận tiền và kích hoạt quảng cáo (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Quảng cáo đã kích hoạt hoặc xếp lịch }
  /api/v1/promotions/admin/orders/{id}/reject:
    post:
      tags: [Promotions]
      summary: Từ chối đơn quảng cáo (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Đã từ chối }
  /api/v1/admin/promotion-orders:
    get:
      tags: [Promotions]
      summary: Tìm và lọc đơn mua quảng cáo
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, CONFIRMED, REJECTED] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        200: { description: Danh sách đơn kèm listing và người mua }
        403: { description: Không có quyền quản lý đơn quảng cáo }
