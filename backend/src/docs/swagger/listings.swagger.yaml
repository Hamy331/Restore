paths:
  /api/v1/listings:
    post:
      tags: [Listings]
      summary: Đăng tin bán hàng
      description: Tạo tin PENDING. UI dùng luồng nháp → tải ảnh → publish; admin duyệt trước khi công khai.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, description, condition, categoryId, location]
              properties:
                title: { type: string, minLength: 5, maxLength: 70 }
                description: { type: string, minLength: 10, maxLength: 1500 }
                price: { type: string, pattern: '^(0|[1-9][0-9]{0,11})$', description: Số nguyên VND; bán cần lớn hơn 0 }
                condition: { type: string, enum: [NEW, LIKE_NEW, USED_GOOD, USED_FAIR, FOR_PARTS] }
                categoryId: { type: string, description: ID từ GET /api/v1/catalog/categories }
                isNegotiable: { type: boolean }
                allowSale: { type: boolean, default: true }
                allowExchange: { type: boolean, default: false }
                exchangeWish: { type: string, maxLength: 200 }
                sellerType: { type: string, enum: [PERSONAL, BUSINESS] }
                attributes: { type: object, description: Kiểu và giá trị theo schema GET /api/v1/catalog/categories }
                location: { $ref: '#/components/schemas/ListingLocationInput' }
      responses:
        201:
          description: Tin vừa được tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ListingPublic' }
        400: { description: Dữ liệu tin không hợp lệ }
        401: { description: Chưa đăng nhập hoặc phiên hết hạn }
        403: { description: Tài khoản không có quyền đăng tin }
    get:
      tags: [Listings]
      summary: Danh sách tin đang hiển thị
      description: Chỉ trả tin AVAILABLE của người bán ACTIVE. Tin Ưu Tiên, ưu tiên cửa hàng trong danh mục trọng tâm, rồi thời điểm Đẩy Tin được xếp trước.
      parameters:
        - in: query
          name: filter
          description: newest mặc định; nearby yêu cầu latitude và longitude; exchange chỉ lấy tin cho phép trao đổi.
          schema: { type: string, enum: [newest, nearby, exchange], default: newest }
        - in: query
          name: allowExchange
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: latitude
          schema: { type: number, minimum: -90, maximum: 90 }
        - in: query
          name: longitude
          schema: { type: number, minimum: -180, maximum: 180 }
        - in: query
          name: radiusKm
          schema: { type: number, minimum: 1, maximum: 100, default: 5 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: limit
          description: Bí danh tương thích của pageSize.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: q
          description: Tìm trong tiêu đề, không phân biệt chữ hoa/thường.
          schema: { type: string, maxLength: 100 }
        - in: query
          name: categoryId
          schema: { type: string, maxLength: 100 }
        - in: query
          name: condition
          schema: { type: string, enum: [NEW, LIKE_NEW, USED_GOOD, USED_FAIR, FOR_PARTS] }
        - in: query
          name: minPrice
          schema: { type: string, pattern: '^[0-9]{1,12}$' }
        - in: query
          name: maxPrice
          schema: { type: string, pattern: '^[0-9]{1,12}$' }
      responses:
        200:
          description: Danh sách và thông tin phân trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ListingPublic' }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      totalItems: { type: integer }
                      totalPages: { type: integer }
        400:
          description: Tham số tìm kiếm/phân trang không hợp lệ
  /api/v1/listings/{id}:
    get:
      tags: [Listings]
      summary: Chi tiết một tin đang hiển thị
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Chi tiết tin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ListingPublic' }
        404:
          description: Không tồn tại hoặc tin không còn hiển thị
    put:
      tags: [Listings]
      summary: Sửa tin đang hiển thị hoặc đã ẩn của chính người dùng
      description: Dùng cùng các trường với POST listings. Tin sửa chuyển PENDING để duyệt lại. Không sửa tin đã bán/trao đổi.
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Tin đã được cập nhật }
        404: { description: Tin không thuộc người dùng }
        409: { description: Tin không còn sửa được hoặc đã thay đổi }
  /api/v1/listings/recommended:
    get:
      tags: [Listings]
      summary: Tin được ưu tiên gợi ý
      description: Trả về các tin đang hiển thị có quảng cáo FEATURED còn hiệu lực.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        200: { description: Danh sách tin gợi ý }
  /api/v1/listings/favorites:
    get:
      tags: [Listings]
      summary: Danh sách tin đã lưu
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        200: { description: Tin đã lưu còn hiển thị và thông tin phân trang }
        401: { description: Chưa đăng nhập hoặc phiên hết hạn }
  /api/v1/listings/{id}/favorite:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Listings]
      summary: Kiểm tra tin đã được lưu chưa
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Trạng thái đã lưu }
    post:
      tags: [Listings]
      summary: Lưu tin yêu thích
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Tin đã được lưu }
        404: { description: Không tìm thấy tin đang hiển thị }
    put:
      tags: [Listings]
      summary: Lưu tin yêu thích (tương thích màn hình cũ)
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Tin đã được lưu }
    delete:
      tags: [Listings]
      summary: Bỏ lưu tin yêu thích
      security: [{ bearerAuth: [] }]
      responses:
        204: { description: Đã bỏ lưu tin }
  /api/v1/listings/summary:
    get:
      tags: [Listings]
      summary: Đếm tin đang hiển thị và đã bán của tôi
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Tổng số tin theo trạng thái }
  /api/v1/listings/drafts/quota:
    get:
      tags: [Listings]
      summary: Hạn mức và số bản nháp hiện tại
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Hạn mức, số đã dùng và số còn lại }
  /api/v1/listings/drafts:
    post:
      tags: [Listings]
      summary: Tạo bản nháp tin đăng
      description: Có thể lưu nháp thiếu tên, giá, mô tả hoặc danh mục. Bản nháp chỉ hiện trong Tin của tôi và không tính hạn mức đăng tin.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingDraftInput' }
      responses:
        201: { description: Đã lưu bản nháp }
        400: { description: Dữ liệu nháp không hợp lệ }
  /api/v1/listings/drafts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      tags: [Listings]
      summary: Cập nhật bản nháp của mình
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingDraftInput' }
      responses:
        200: { description: Bản nháp đã cập nhật }
        404: { description: Không tìm thấy bản nháp của mình }
        409: { description: Tin không còn là bản nháp }
    delete:
      tags: [Listings]
      summary: Xóa bản nháp của mình
      security: [{ bearerAuth: [] }]
      responses:
        204: { description: Đã xóa bản nháp và ảnh của nó }
        404: { description: Không tìm thấy bản nháp của mình }
  /api/v1/listings/drafts/{id}/publish:
    post:
      tags: [Listings]
      summary: Đăng bản nháp
      description: Kiểm tra dữ liệu tin đăng đầy đủ và hạn mức tại lúc đăng; sau đó tin chuyển PENDING, chỉ công khai khi admin duyệt.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200: { description: Bản nháp đã được đăng }
        400: { description: Tin chưa đủ thông tin để đăng }
        409: { description: Tin đã thay đổi hoặc vượt hạn mức }
  /api/v1/listings/admin/pending:
    get:
      tags: [Listings]
      summary: Danh sách tin chờ kiểm duyệt
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Tối đa 100 tin đang chờ, tin gửi trước ở đầu danh sách }
        403: { description: Không có quyền kiểm duyệt tin }
  /api/v1/listings/admin/{id}/decision:
    post:
      tags: [Listings]
      summary: Duyệt hoặc từ chối một tin đang chờ
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, updatedAt]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: string, minLength: 5, maxLength: 300 }
                updatedAt: { type: string, format: date-time }
      responses:
        200: { description: Đã xử lý tin }
        403: { description: Không có quyền kiểm duyệt tin }
        409: { description: Tin đã thay đổi sau khi Admin mở chi tiết }
  /api/v1/admin/listings:
    get:
      tags: [Listings]
      summary: Tìm và lọc tin trong trang quản trị
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [DRAFT, PENDING, REJECTED, AVAILABLE, HIDDEN, RESERVED, SOLD, EXCHANGED] }
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        200: { description: Danh sách tin kèm chủ tin và danh mục }
        403: { description: Không có quyền quản trị tin }
  /api/v1/admin/listings/{id}/decision:
    post:
      tags: [Listings]
      summary: Duyệt, từ chối, yêu cầu chỉnh sửa hoặc gỡ tin
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason, updatedAt]
              properties:
                action: { type: string, enum: [APPROVE, REJECT, REQUEST_CHANGES, REMOVE] }
                reason: { type: string, minLength: 0, maxLength: 300 }
                updatedAt: { type: string, format: date-time }
      responses:
        200: { description: Đã cập nhật quyết định kiểm duyệt }
        403: { description: Không có quyền quản trị tin }
        409: { description: Tin đã thay đổi sau khi Admin mở chi tiết }
  /api/v1/listings/mine:
    get:
      tags: [Listings]
      summary: Tin của người dùng đang đăng nhập
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [DRAFT, PENDING, REJECTED, AVAILABLE, HIDDEN, RESERVED, SOLD, EXCHANGED] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        200: { description: Danh sách tin và thông tin phân trang }
  /api/v1/listings/mine/{id}:
    get:
      tags: [Listings]
      summary: Chi tiết tin của chính người dùng, kể cả nháp, tin đã ẩn hoặc bán
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Chi tiết tin }
        404: { description: Tin không tồn tại hoặc không thuộc người dùng }
  /api/v1/listings/{id}/status:
    patch:
      tags: [Listings]
      summary: Ẩn, hiện lại hoặc đánh dấu đã bán tin của chính người dùng
      description: AVAILABLE/HIDDEN có thể đánh dấu SOLD hoặc EXCHANGED nếu tin hỗ trợ giao dịch đó. SOLD/EXCHANGED không thể mở lại. Hiện lại phải còn hạn mức.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [AVAILABLE, HIDDEN, SOLD, EXCHANGED] }
      responses:
        200: { description: Tin đã đổi trạng thái }
        404: { description: Tin không thuộc người dùng }
        409: { description: Chuyển trạng thái không hợp lệ hoặc đã hết hạn mức }
  /api/v1/listings/{id}/images:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Listings]
      summary: Tải ảnh lên tin của mình
      description: Gửi bytes JPEG/PNG/WebP, tối đa 5 MB/ảnh và 20 ảnh/tin. Nháp giữ DRAFT; tin khác chuyển PENDING để duyệt lại.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        201: { description: URL ảnh vừa tải lên }
        400: { description: Ảnh sai định dạng hoặc quá dung lượng }
        404: { description: Tin không thuộc người dùng }
        409: { description: Tin không thể sửa hoặc đã đủ 20 ảnh }
    put:
      tags: [Listings]
      summary: Đổi thứ tự hoặc xóa ảnh tin của mình
      description: Danh sách mới chỉ được chứa URL đã gắn với tin. Phần tử đầu tiên là ảnh bìa.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 20
                  items: { type: string }
      responses:
        200: { description: Danh sách ảnh đã được cập nhật }
        404: { description: Tin không thuộc người dùng }
  /api/v1/listings/media/{filename}:
    get:
      tags: [Listings]
      summary: Xem ảnh tin đăng
      description: Ảnh tin AVAILABLE được công khai; ảnh nháp/chờ duyệt/ẩn chỉ chủ tin hoặc admin có Bearer JWT mới xem được.
      parameters:
        - in: path
          name: filename
          required: true
          schema: { type: string }
      responses:
        200: { description: Nội dung ảnh }
        404: { description: Không tìm thấy ảnh }
components:
  schemas:
    ListingLocationInput:
      type: object
      additionalProperties: false
      required: [provinceCode, wardCode]
      properties:
        provinceCode: { type: string }
        wardCode: { type: string }
        streetAddress: { type: string, maxLength: 200 }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        geoSource: { type: string, enum: [device, ward_center] }
    ListingDraftInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 70 }
        description: { type: string, maxLength: 1500 }
        price: { type: string, pattern: '^(0|[1-9][0-9]{0,11})$', description: Để trống hoặc 0 nếu chưa chọn giá }
        condition: { type: string, nullable: true, enum: [NEW, LIKE_NEW, USED_GOOD, USED_FAIR, FOR_PARTS] }
        categoryId: { type: string, nullable: true }
        isNegotiable: { type: boolean }
        allowSale: { type: boolean, default: true }
        allowExchange: { type: boolean, default: false }
        exchangeWish: { type: string, maxLength: 200 }
        sellerType: { type: string, enum: [PERSONAL, BUSINESS] }
        attributes: { type: object }
        location: { $ref: '#/components/schemas/ListingLocationInput' }
    ListingPublic:
      type: object
      required: [id, title, description, price, isNegotiable, condition, images, createdAt, owner]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        price: { type: string, description: Giá trị thập phân dạng chuỗi }
        isNegotiable: { type: boolean }
        condition: { type: string, enum: [NEW, LIKE_NEW, USED_GOOD, USED_FAIR, FOR_PARTS] }
        category:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        images:
          type: array
          items: { type: string, description: Đường dẫn ảnh tương đối từ gốc backend }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
        owner:
          type: object
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            ratingAverage: { type: number }
            ratingCount: { type: integer }
